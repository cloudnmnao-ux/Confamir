<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>پنل مدیریت</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--a:#7c5cff;--a2:#38d4ff;--r:16px;--fs:15px;--bl:14px;--pad:14px;--avr:13px}
[data-t=dark]{--bg:#0a0c13;--c:rgba(255,255,255,.055);--c2:rgba(255,255,255,.09);--t:#eef0f8;--m:#8d95b0;--b:rgba(255,255,255,.1);--in:rgba(0,0,0,.28)}
[data-t=light]{--bg:#f2f4fb;--c:#fff;--c2:#eef1fa;--t:#171c30;--m:#6a7391;--b:#e0e4f0;--in:#f5f7fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font-family:var(--ff,system-ui,Tahoma,sans-serif);font-size:var(--fs);min-height:100vh;padding:0 0 90px}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none}
body[data-bg=gradient]::before{inset:0;background:radial-gradient(800px 420px at 85% -5%,color-mix(in srgb,var(--a) 45%,transparent),transparent 65%),radial-gradient(600px 400px at 0 105%,color-mix(in srgb,var(--a2) 28%,transparent),transparent 60%)}
body[data-bg=mesh]::before{inset:0;background:radial-gradient(500px 300px at 10% 10%,color-mix(in srgb,var(--a) 40%,transparent),transparent),radial-gradient(500px 300px at 90% 20%,color-mix(in srgb,var(--a2) 40%,transparent),transparent),radial-gradient(600px 400px at 50% 100%,color-mix(in srgb,var(--a) 30%,transparent),transparent)}
body[data-bg=aurora]::before,body[data-bg=aurora]::after{width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.4}
body[data-bg=aurora]::before{background:var(--a);top:-30vmax;right:-20vmax;animation:fl 18s ease-in-out infinite alternate}
body[data-bg=aurora]::after{background:var(--a2);bottom:-35vmax;left:-25vmax;animation:fl 22s ease-in-out infinite alternate-reverse}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
body[data-bg=grid]::before{inset:0;background:linear-gradient(var(--b) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--b) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(600px 400px at 50% 0,color-mix(in srgb,var(--a) 25%,transparent),transparent)}
body[data-an=off] *,body[data-an=off]::before,body[data-an=off]::after{animation:none!important;transition:none!important}
body[data-cs=solid] .card{background:var(--c2);backdrop-filter:none}
body[data-cs=outline] .card{background:transparent;border:1.5px solid var(--a);backdrop-filter:none}
body[data-cs=neon] .card{box-shadow:0 0 22px color-mix(in srgb,var(--a) 35%,transparent);border-color:color-mix(in srgb,var(--a) 60%,transparent)}
body[data-d=compact]{--pad:9px}body[data-d=roomy]{--pad:21px}
body[data-ly=grid] #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}body[data-ly=grid] .u{margin:0}
.fab,.btn.p,.chip.on,.av{box-shadow:none}
.w{max-width:900px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
header h1{font-size:20px;margin:0;flex:1;font-weight:800}
.ic{width:42px;height:42px;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--t);font-size:18px;cursor:pointer}
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--r);backdrop-filter:blur(var(--bl));-webkit-backdrop-filter:blur(var(--bl))}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{padding:14px}.st small{color:var(--m);font-size:12px}.st b{display:block;font-size:22px;margin-top:4px}
.st i{font-style:normal;float:left;font-size:20px;opacity:.9}
.bar{display:flex;gap:8px;margin:14px 0 8px}
input,select,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--b);background:var(--in);color:var(--t);font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a);outline-offset:-1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--b);background:var(--c);color:var(--m);font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border-color:transparent}
.u{padding:var(--pad);margin:10px 0}
.top{display:flex;align-items:center;gap:11px}
.av{width:42px;height:42px;border-radius:var(--avr);display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--a),var(--a2))}
.nm{flex:1;min-width:0}.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{color:var(--m)}
.tag{font-size:11px;padding:4px 10px;border-radius:99px;font-weight:700}
.ok{background:#1fa86a33;color:#35d68a}.no{background:#e5484d33;color:#ff7a80}.off{background:#8d95b033;color:var(--m)}
.pb{height:8px;border-radius:9px;background:var(--in);margin:12px 0 6px;overflow:hidden}
.pb div{height:100%;border-radius:9px;transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--m)}
.act{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:64px;padding:9px 6px;border-radius:11px;border:1px solid var(--b);background:var(--c2);color:var(--t);font-size:13px;cursor:pointer;font-family:inherit}
.btn.p{background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent;color:#fff;font-weight:700}
.btn.d{color:#ff7a80}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:18px;height:56px;padding:0 22px;border-radius:99px;border:0;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-size:16px;font-weight:800;box-shadow:0 10px 30px color-mix(in srgb,var(--a) 55%,transparent);cursor:pointer}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20;backdrop-filter:blur(4px)}
.mo.on{display:flex}
.sh{width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--b);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.mo{align-items:center}.sh{border-radius:24px}}
.sh h3{margin:0 0 12px}label{display:block;font-size:12.5px;color:var(--m);margin:11px 0 5px}
.row{display:flex;gap:10px}.row>*{flex:1}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw span{width:38px;height:38px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.sw span.on{border-color:var(--t)}
#qr{display:grid;place-items:center;padding:14px;background:#fff;border-radius:16px;margin:8px auto;width:fit-content}
.lk{font-size:11.5px;word-break:break-all;color:var(--m);background:var(--in);padding:9px;border-radius:10px;margin-top:6px;direction:ltr;text-align:left}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-90px);background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;z-index:50;transition:.3s}
#toast.on{transform:translateX(-50%)}
.empty{text-align:center;color:var(--m);padding:40px 0}
</style>
</head>
<body data-bg="gradient" data-an="on">
<div class="w">
  <header>
    <h1 id="ttl">🛰️ پنل مدیریت</h1>
    <button class="ic" onclick="openSet()" title="تنظیمات">⚙️</button>
    <button class="ic" onclick="location='/logout'" title="خروج">⏻</button>
  </header>

  <div class="stats">
    <div class="card st"><i>👥</i><small>کل کاربران</small><b id="s1">–</b></div>
    <div class="card st"><i>✅</i><small>فعال</small><b id="s2">–</b></div>
    <div class="card st"><i>📊</i><small>کل مصرف</small><b id="s3">–</b></div>
    <div class="card st"><i>🖥️</i><small>رم / بار سرور</small><b id="s4" style="font-size:17px">–</b></div>
  </div>

  <div class="bar"><input id="q" placeholder="🔎 جستجوی کاربر یا یادداشت..." oninput="render()"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>

<button class="fab" onclick="openUser()">＋ کاربر جدید</button>

<!-- user modal -->
<div class="mo" id="mu" onclick="if(event.target===this)cl('mu')"><div class="sh">
  <h3 id="mut">کاربر جدید</h3>
  <label>نام</label><input id="fn">
  <div class="row"><div><label>حجم (GB) — 0 = نامحدود</label><input id="fg" type="number" min="0" step="any" value="0"></div>
  <div><label>مدت (روز) — 0 = نامحدود</label><input id="fd" type="number" min="0" value="0"></div></div>
  <label id="qk" style="display:none">افزودن سریع</label>
  <div class="act" id="quick" style="display:none;margin-top:0">
    <button class="btn" onclick="quick({add_days:30})">+۳۰ روز</button>
    <button class="btn" onclick="quick({add_gb:10})">+۱۰ گیگ</button>
    <button class="btn" onclick="quick({add_gb:50})">+۵۰ گیگ</button>
  </div>
  <label>یادداشت</label><textarea id="fnote" rows="2"></textarea>
  <div class="act"><button class="btn p" onclick="saveUser()">ذخیره</button><button class="btn" onclick="cl('mu')">بستن</button></div>
</div></div>

<!-- qr modal -->
<div class="mo" id="mq" onclick="if(event.target===this)cl('mq')"><div class="sh" style="text-align:center">
  <h3 id="qt"></h3><div id="qr"></div>
  <div class="lk" id="ql"></div>
  <div class="act"><button class="btn p" onclick="cp(qs)">کپی لینک ساب</button><button class="btn" onclick="cp(qv)">کپی کانفیگ</button></div>
  <div class="act"><button class="btn" onclick="cl('mq')">بستن</button></div>
</div></div>

<div class="mo" id="ms" onclick="if(event.target===this)closeSet()"><div class="sh" id="sb"></div></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
 if(r.status===401){document.body.innerHTML='<p style="padding:40px">دسترسی نداری؛ لینک ورودت رو دوباره باز کن.</p>';throw 0}return r.json()};
const GB=1073741824,fb=x=>x>=GB?(x/GB).toFixed(2)+' GB':(x/1048576).toFixed(1)+' MB';
const COLORS=['#7c5cff','#3b82f6','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899','#a855f7'];
let users=[],S={},filt='all',editId=null,qs='',qv='';
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function cl(id){$(id).classList.remove('on')}
async function cp(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('✅ کپی شد')}

const FONTS={system:'system-ui,Tahoma,sans-serif',vazir:'Vazirmatn,Tahoma,sans-serif',tahoma:'Tahoma,sans-serif',mono:'ui-monospace,Menlo,Consolas,monospace'};
function applyTheme(T=S){const r=document.documentElement,st=r.style;
 st.setProperty('--a',T.accent);st.setProperty('--a2',T.accent2);st.setProperty('--r',T.radius+'px');
 st.setProperty('--fs',T.fsize+'px');st.setProperty('--bl',T.blur+'px');st.setProperty('--ff',FONTS[T.font]||FONTS.system);
 st.setProperty('--avr',{circle:'50%',squircle:'13px',square:'4px'}[T.shape]||'13px');
 let t=T.theme;if(t==='auto')t=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';r.dataset.t=t;
 st.setProperty('--c',t==='dark'?`rgba(255,255,255,${.02+T.opacity*.0018})`:`rgba(255,255,255,${.4+T.opacity*.006})`);
 const d=document.body.dataset;d.bg=T.bg;d.cs=T.cardstyle;d.ly=T.layout;d.d=T.density;d.an=T.anim==='0'?'off':'on';
 if(T.font==='vazir'&&!$('vf')){const l=document.createElement('link');l.id='vf';l.rel='stylesheet';l.href='https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css';document.head.appendChild(l)}
 $('ttl').textContent='🛰️ '+T.title;document.title=T.title}
const barBg=c=>S.pbar==='status'?c:S.pbar==='striped'?'repeating-linear-gradient(45deg,var(--a) 0 10px,var(--a2) 10px 20px)':'linear-gradient(90deg,var(--a),var(--a2))';

function render(){
 const q=$('q').value.trim().toLowerCase(),now=Date.now()/1000;
 const F={all:u=>1,active:u=>u.active,expired:u=>u.expire&&u.expire<now,off:u=>!u.enabled,full:u=>u.limit_bytes&&u.up+u.down>=u.limit_bytes};
 const N={all:'همه',active:'فعال',expired:'منقضی',full:'حجم تمام',off:'غیرفعال'};
 $('chips').innerHTML=Object.keys(N).map(k=>`<div class="chip ${filt===k?'on':''}" onclick="filt='${k}';render()">${N[k]} (${users.filter(F[k]).length})</div>`).join('');
 const L=users.filter(F[filt]).filter(u=>!q||(u.name+' '+u.note).toLowerCase().includes(q));
 $('list').innerHTML=L.length?L.map(u=>{
  const used=u.up+u.down,p=u.limit_bytes?Math.min(100,used/u.limit_bytes*100):0;
  const col=p<70?'#22c55e':p<90?'#f59e0b':'#ef4444';
  const days=u.expire?Math.ceil((u.expire-now)/86400):null;
  const exp=days===null?'♾️ نامحدود':days<=0?'⛔ منقضی شده':days+' روز مانده';
  const tag=!u.enabled?['off','غیرفعال']:u.active?['ok','فعال']:['no','تمام شده'];
  return `<div class="card u"><div class="top"><div class="av">${esc(u.name[0]||'?')}</div>
  <div class="nm"><b>${esc(u.name)}</b><small>${esc(u.note||'—')}</small></div><span class="tag ${tag[0]}">${tag[1]}</span></div>
  <div class="pb"><div style="width:${u.limit_bytes?p:100}%;background:${barBg(col)};${u.limit_bytes?'':'opacity:.35'}"></div></div>
  <div class="meta"><span>${fb(used)} / ${u.limit_bytes?fb(u.limit_bytes):'♾️'}</span><span>${exp}</span></div>
  <div class="meta" style="margin-top:3px"><span>↑ ${fb(u.up)}</span><span>↓ ${fb(u.down)}</span></div>
  <div class="act"><button class="btn p" onclick="qr(${u.id})">QR / لینک</button>
  <button class="btn" onclick="cp(location.origin+'/sub/${u.token}')">ساب</button>
  <button class="btn" onclick="openUser(${u.id})">ویرایش</button>
  <button class="btn" onclick="up(${u.id},{enabled:${!u.enabled}})">${u.enabled?'⏸':'▶️'}</button>
  <button class="btn" onclick="if(confirm('مصرف صفر شود؟'))up(${u.id},{reset:true})">ریست</button>
  <button class="btn d" onclick="rm(${u.id})">🗑</button></div></div>`}).join(''):'<div class="empty">کاربری پیدا نشد</div>'}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load(){
 [users,S]=await Promise.all([api('GET','/api/users'),api('GET','/api/settings')]);applyTheme();render();
 const s=await api('GET','/api/stats');
 $('s1').textContent=s.users;$('s2').textContent=s.active;$('s3').textContent=fb(s.traffic);
 $('s4').textContent=s.ram_total?Math.round(s.ram_used/s.ram_total*100)+'% · '+s.load.toFixed(2):'–'}

function openUser(id){editId=id||null;const u=users.find(x=>x.id===id);
 $('mut').textContent=u?'ویرایش کاربر':'کاربر جدید';$('fn').value=u?u.name:'';
 $('fg').value=u?+(u.limit_bytes/GB).toFixed(2):0;$('fd').value=u&&u.expire?Math.max(0,Math.ceil((u.expire-Date.now()/1000)/86400)):0;
 $('fnote').value=u?u.note:'';$('quick').style.display=$('qk').style.display=u?'':'none';$('mu').classList.add('on')}
async function saveUser(){
 const b={name:$('fn').value||'user',gb:+$('fg').value||0,days:+$('fd').value||0,note:$('fnote').value};
 await api(editId?'PUT':'POST',editId?'/api/users/'+editId:'/api/users',b);cl('mu');toast('✅ ذخیره شد');load()}
async function quick(b){await api('PUT','/api/users/'+editId,b);toast('✅ اعمال شد');cl('mu');load()}
async function up(i,b){await api('PUT','/api/users/'+i,b);load()}
async function rm(i){if(confirm('این کاربر حذف شود؟')){await api('DELETE','/api/users/'+i);load()}}
function qr(id){const u=users.find(x=>x.id===id);qs=location.origin+'/sub/'+u.token;qv=u.link;
 $('qt').textContent=u.name;$('ql').textContent=qs;$('qr').innerHTML='';
 if(window.QRCode)new QRCode($('qr'),{text:qs,width:210,height:210});$('mq').classList.add('on')}

const PRE={midnight:['#7c5cff','#38d4ff','نیمه‌شب'],ocean:['#0ea5e9','#22d3ee','اقیانوس'],aurora:['#10b981','#6366f1','شفق'],sunset:['#f97316','#ec4899','غروب'],rose:['#f43f5e','#fb923c','رز'],forest:['#22c55e','#a3e635','جنگل'],gold:['#f59e0b','#ef4444','طلا'],violet:['#a855f7','#ec4899','بنفش'],cyber:['#00f5d4','#9b5de5','سایبر'],mono:['#94a3b8','#e2e8f0','مونو']};
const OPT={theme:['تم',[['dark','تیره'],['light','روشن'],['auto','خودکار']]],
 bg:['پس‌زمینه',[['gradient','گرادیانت'],['mesh','مش'],['aurora','شفق متحرک'],['grid','شبکه'],['plain','ساده']]],
 cardstyle:['سبک کارت',[['glass','شیشه‌ای'],['solid','تخت'],['outline','خط‌دار'],['neon','نئون']]],
 layout:['چیدمان کاربران',[['list','لیستی'],['grid','شبکه‌ای']]],
 density:['تراکم',[['compact','فشرده'],['normal','معمولی'],['roomy','باز']]],
 shape:['شکل آواتار',[['circle','دایره'],['squircle','گرد'],['square','مربع']]],
 pbar:['نوار مصرف',[['gradient','گرادیانت'],['status','رنگ وضعیت'],['striped','راه‌راه']]],
 font:['فونت',[['system','سیستم'],['vazir','وزیرمتن'],['tahoma','Tahoma'],['mono','Mono']]],
 anim:['انیمیشن‌ها',[['1','روشن'],['0','خاموش']]]};
const RNG={fsize:['اندازه متن',12,19],radius:['گردی گوشه‌ها',2,32],blur:['شدت بلور',0,40],opacity:['شفافیت کارت‌ها',0,100]};
const DEF={accent:'#7c5cff',accent2:'#38d4ff',theme:'dark',radius:'16',bg:'gradient',cardstyle:'glass',layout:'list',density:'normal',shape:'squircle',pbar:'gradient',font:'system',fsize:'15',blur:'14',opacity:'40',anim:'1'};
function openSet(){
 const col=(k,n)=>`<div><label>${n}</label><input id="s_${k}" type="color" value="${S[k]}" style="height:44px;padding:4px"></div>`;
 $('sb').innerHTML=`<h3>🎨 ظاهر پنل</h3><label>عنوان پنل</label><input id="s_title" value="${esc(S.title)}">
 <label>تم‌های رنگی آماده</label><div class="sw">${Object.entries(PRE).map(([k,[a,b,n]])=>`<span title="${n}" style="background:linear-gradient(135deg,${a},${b})" onclick="pre('${k}')"></span>`).join('')}</div>
 <div class="row">${col('accent','رنگ اصلی')}${col('accent2','رنگ دوم')}</div>
 ${Object.entries(OPT).map(([k,[n,o]])=>`<label>${n}</label><select id="s_${k}">${o.map(([a,b])=>`<option value="${a}">${b}</option>`).join('')}</select>`).join('')}
 ${Object.entries(RNG).map(([k,[n,a,b]])=>`<label>${n}: <b id="v_${k}">${S[k]}</b></label><input id="s_${k}" type="range" min="${a}" max="${b}" value="${S[k]}">`).join('')}
 <h3 style="margin-top:22px">🌐 اتصال</h3>
 <label>دامنه ریلوی (SNI و Host)</label><input id="s_domain" dir="ltr" value="${esc(S.domain||S.default_domain)}" placeholder="your-app.up.railway.app">
 <label>آدرس اتصال (IP یا دامنه؛ خالی = همان دامنه)</label><input id="s_address" dir="ltr" value="${esc(S.address)}">
 <div class="row"><div><label>Fingerprint</label><select id="s_fp">${['android','chrome','firefox','safari','ios','random'].map(x=>`<option>${x}</option>`).join('')}</select></div>
 <div><label>پیشوند نام کانفیگ</label><input id="s_prefix" value="${esc(S.prefix)}"></div></div>
 <div class="act"><button class="btn p" onclick="saveSet()">ذخیره</button><button class="btn" onclick="resetSet()">پیش‌فرض ظاهر</button><button class="btn" onclick="closeSet()">بستن</button></div>`;
 for(const k in OPT)$('s_'+k).value=S[k];$('s_fp').value=S.fp;
 $('sb').oninput=prev;$('ms').classList.add('on')}
function val(){const T={...S};document.querySelectorAll('#sb [id^=s_]').forEach(e=>T[e.id.slice(2)]=e.value);for(const k in RNG)$('v_'+k).textContent=T[k];return T}
const prev=()=>applyTheme(val());
function pre(k){$('s_accent').value=PRE[k][0];$('s_accent2').value=PRE[k][1];prev()}
function closeSet(){cl('ms');applyTheme()}
async function saveSet(){const T=val(),b={};document.querySelectorAll('#sb [id^=s_]').forEach(e=>b[e.id.slice(2)]=e.value);
 await api('PUT','/api/settings',b);cl('ms');toast('✅ تنظیمات ذخیره شد');load()}
async function resetSet(){if(confirm('ظاهر به پیش‌فرض برگردد؟')){await api('PUT','/api/settings',DEF);cl('ms');toast('✅ برگشت به پیش‌فرض');load()}}

load();setInterval(load,30000);
</script>
